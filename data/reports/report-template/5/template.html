<!DOCTYPE html>
<!-- Hallmark · macrostructure: Workbench · genre: developer-tool · theme: Linear · dark -->
<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{WEEK_LABEL}} — My Knowledge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: oklch(8% 0.01 260);
      --color-bg-2: oklch(12% 0.012 260);
      --color-ink: oklch(90% 0.005 260);
      --color-ink-2: oklch(52% 0.008 260);
      --color-accent: oklch(65% 0.22 250);
      --color-border: oklch(20% 0.012 260);
      --font-body: system-ui, "SF Pro Text", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", monospace;
      --space-sm: 0.75rem;
      --space-md: 1.5rem;
      --space-lg: 3rem;
      --space-xl: 5rem;
    }

    html { overflow-x: clip; }
    body {
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 100dvh;
    }

    /* ── Top bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(20, 20, 30, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      padding: 0 var(--space-lg);
      height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    .topbar__brand {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-ink);
      letter-spacing: 0.02em;
    }
    .topbar__week {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-ink-2);
    }

    /* ── Main ── */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
    }

    /* ── Page heading ── */
    .page-heading {
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .page-heading__title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 0.3rem;
    }
    .page-heading__meta {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-ink-2);
    }

    /* ── Section ── */
    .section { margin-bottom: var(--space-lg); }
    .section-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-ink-2);
      padding: var(--space-sm) 0 0.35rem;
      border-top: 1px solid var(--color-border);
      margin-bottom: 0;
    }

    /* ── Article row ── */
    .article {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-sm) var(--space-md);
      align-items: baseline;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--color-border);
    }
    .article:last-child { border-bottom: none; }
    .article__main { min-width: 0; }
    .article__headline {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 0.2rem;
      overflow-wrap: anywhere;
      min-width: 0;
    }
    .article__headline a {
      color: var(--color-ink);
      text-decoration: none;
    }
    .article__headline a:hover { color: var(--color-accent); }
    .article__body {
      font-size: 0.82rem;
      color: var(--color-ink-2);
      line-height: 1.55;
      margin-top: 0.2rem;
      overflow-wrap: anywhere;
    }
    .article__aside {
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .article__source {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--color-ink-2);
      display: block;
      line-height: 1.4;
    }
    .article__date {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--color-border);
      display: block;
    }

    /* ── Footer ── */
    .footer {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-sm) var(--space-lg) var(--space-md);
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .footer__text {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--color-ink-2);
    }

    @media (max-width: 700px) {
      .topbar, .main, .footer { padding-left: var(--space-sm); padding-right: var(--space-sm); }
      .article { grid-template-columns: 1fr; }
      .article__aside { text-align: left; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand">My Knowledge</div>
    <div class="topbar__week">{{WEEK_LABEL}}</div>
  </header>

  <main class="main">
    <div class="page-heading">
      <div class="page-heading__title">Weekly Knowledge Log</div>
      <div class="page-heading__meta">generated {{GENERATED_DATE}}</div>
    </div>

    <section class="section" id="tech">
      <div class="section-label">Technology &amp; Development</div>
      {{TECH_ARTICLES}}
    </section>

    <section class="section" id="other">
      <div class="section-label">World, Economy, Science &amp; Culture</div>
      {{OTHER_ARTICLES}}
    </section>
  </main>

  <footer class="footer">
    <span class="footer__text">my-knowledge/weekly</span>
    <span class="footer__text">{{GENERATED_DATE}}</span>
  </footer>

</body>
</html>
