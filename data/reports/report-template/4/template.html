<!DOCTYPE html>
<!-- Hallmark · macrostructure: Manifesto · genre: minimal-jp · theme: Wabi · light -->
<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{WEEK_LABEL}} — 知識の記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper: oklch(96% 0.008 90);
      --color-ink: oklch(14% 0.01 200);
      --color-ink-2: oklch(48% 0.008 200);
      --color-accent: oklch(42% 0.2 28);
      --color-border: oklch(78% 0.008 90);
      --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", Georgia, serif;
      --font-sans: system-ui, "Hiragino Kaku Gothic ProN", sans-serif;
      --space-sm: 1rem;
      --space-md: 2.5rem;
      --space-lg: 6rem;
      --space-xl: 10rem;
    }

    html { overflow-x: clip; }
    body {
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.85;
      min-height: 100dvh;
    }

    /* ── Slim anchor bar ── */
    .anchor-bar {
      padding: 0.75rem var(--space-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
    }
    .anchor-bar__brand {
      font-family: var(--font-serif);
      font-size: 0.8rem;
      color: var(--color-ink-2);
      letter-spacing: 0.06em;
    }
    .anchor-bar__links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    .anchor-bar__links a {
      font-size: 0.72rem;
      color: var(--color-ink-2);
      text-decoration: none;
      letter-spacing: 0.06em;
    }
    .anchor-bar__links a:hover { color: var(--color-accent); }

    /* ── Page header ── */
    .page-header {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md) var(--space-lg);
    }
    .page-header__label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-ink-2);
      margin-bottom: var(--space-sm);
    }
    .page-header__title {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.02em;
      color: var(--color-ink);
    }
    .page-header__date {
      margin-top: var(--space-sm);
      font-size: 0.72rem;
      color: var(--color-ink-2);
      letter-spacing: 0.06em;
    }

    /* ── Typographic divider ── */
    .divider {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 var(--space-md);
    }
    .divider__rule {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 0;
    }
    .divider__label {
      font-family: var(--font-serif);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--color-ink-2);
      padding-top: 0.5rem;
    }

    /* ── Section ── */
    .section {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-md) var(--space-md) var(--space-xl);
    }

    /* ── Article ── */
    .article {
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .article:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .article__headline {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin-bottom: 0.4rem;
      color: var(--color-ink);
    }
    .article__headline a {
      color: inherit;
      text-decoration: none;
    }
    .article__headline a:hover { color: var(--color-accent); }
    .article__meta {
      font-size: 0.7rem;
      color: var(--color-ink-2);
      margin-bottom: 0.6rem;
      letter-spacing: 0.04em;
    }
    .article__body {
      font-size: 0.88rem;
      line-height: 1.85;
      color: var(--color-ink);
    }
    .article__source {
      display: inline;
      color: var(--color-accent);
      font-size: 0.72rem;
      text-decoration: none;
    }
    .article__source:hover { text-decoration: underline; }

    /* ── Ma (間) spacer ── */
    .ma {
      height: var(--space-xl);
    }

    /* ── Footer ── */
    .footer {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-md);
      border-top: 1px solid var(--color-border);
      font-size: 0.68rem;
      color: var(--color-ink-2);
      letter-spacing: 0.08em;
      text-align: center;
    }

    @media (max-width: 600px) {
      :root { --space-lg: 3rem; --space-xl: 5rem; }
      .anchor-bar { padding: 0.6rem var(--space-sm); }
      .anchor-bar__links { gap: 0.8rem; }
      .page-header { padding: var(--space-lg) var(--space-sm) var(--space-md); }
      .section, .divider, .footer { padding-left: var(--space-sm); padding-right: var(--space-sm); }
    }
  </style>
</head>
<body>

  <nav class="anchor-bar" aria-label="ページ内ナビ">
    <div class="anchor-bar__brand">知識の記録</div>
    <ul class="anchor-bar__links">
      <li><a href="#tech">技術</a></li>
      <li><a href="#other">世界</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <div class="page-header__label">週次知識まとめ</div>
    <h1 class="page-header__title">{{WEEK_LABEL}}</h1>
    <div class="page-header__date">{{GENERATED_DATE}}</div>
  </header>

  <div class="divider" id="tech">
    <hr class="divider__rule">
    <div class="divider__label">技術 · Technology</div>
  </div>
  <section class="section">
    {{TECH_ARTICLES}}
  </section>

  <div class="divider" id="other">
    <hr class="divider__rule">
    <div class="divider__label">世界 · World &amp; More</div>
  </div>
  <section class="section">
    {{OTHER_ARTICLES}}
  </section>

  <div class="ma" aria-hidden="true"></div>

  <footer class="footer">
    My Knowledge · {{WEEK_LABEL}} · {{GENERATED_DATE}}
  </footer>

</body>
</html>
