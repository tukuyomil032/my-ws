<!DOCTYPE html>
<!-- Hallmark · macrostructure: Bento Grid · genre: reading · theme: Night Study · dark -->
<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{WEEK_LABEL}} — My Knowledge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: oklch(10% 0.015 50);
      --color-bg-2: oklch(14% 0.018 50);
      --color-ink: oklch(88% 0.012 75);
      --color-ink-2: oklch(55% 0.012 75);
      --color-accent: oklch(72% 0.15 75);
      --color-border: oklch(20% 0.015 50);
      --color-ind-tech: oklch(62% 0.2 250);
      --color-ind-other: oklch(58% 0.18 155);
      --font-body: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      --font-reading: Georgia, "Times New Roman", serif;
      --space-sm: 0.75rem;
      --space-md: 1.5rem;
      --space-lg: 3rem;
      --space-xl: 5rem;
    }

    html { overflow-x: clip; }
    body {
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.65;
      min-height: 100dvh;
    }

    /* ── Header ── */
    .page-header {
      padding: var(--space-lg) var(--space-lg) var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .page-header__brand {
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-ink-2);
      margin-bottom: 0.4rem;
    }
    .page-header__title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--color-ink);
    }
    .page-header__date {
      margin-top: 0.3rem;
      font-size: 0.72rem;
      color: var(--color-ink-2);
    }

    /* ── Content ── */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
    }

    /* ── Section header row ── */
    .section-row {
      grid-column: 1 / -1;
      padding: 0.5rem 0 0.35rem;
      border-top: 1px solid var(--color-border);
      margin-bottom: 0;
    }
    .section-row__label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-ink-2);
    }

    /* ── Bento grid ── */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-sm);
      margin-top: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    /* ── Notebook card ── */
    .card {
      background: var(--color-bg-2);
      padding: var(--space-md);
      position: relative;
    }
    .card--tech {
      box-shadow: inset 3px 0 0 var(--color-ind-tech);
    }
    .card--other {
      box-shadow: inset 3px 0 0 var(--color-ind-other);
    }
    .card__headline {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.3rem;
      overflow-wrap: anywhere;
    }
    .card__headline a {
      color: var(--color-ink);
      text-decoration: none;
    }
    .card__headline a:hover { color: var(--color-accent); }
    .card__meta {
      font-size: 0.68rem;
      color: var(--color-ink-2);
      margin-bottom: 0.5rem;
    }
    .card__body {
      font-size: 0.83rem;
      line-height: 1.6;
      color: var(--color-ink-2);
      overflow-wrap: anywhere;
    }
    .card__body em, .card__body blockquote {
      font-family: var(--font-reading);
      font-style: italic;
      color: var(--color-ink);
    }

    /* ── Footer ── */
    .footer {
      padding: var(--space-sm) var(--space-lg);
      border-top: 1px solid var(--color-border);
      font-size: 0.68rem;
      color: var(--color-ink-2);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    @media (max-width: 640px) {
      .page-header, .content, .footer { padding-left: var(--space-sm); padding-right: var(--space-sm); }
      .page-header { padding-top: var(--space-md); }
      .bento-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="page-header__brand">My Knowledge · Weekly</div>
    <h1 class="page-header__title">{{WEEK_LABEL}}</h1>
    <div class="page-header__date">{{GENERATED_DATE}}</div>
  </header>

  <main class="content">
    <div class="section-row">
      <div class="section-row__label">Technology &amp; Development</div>
    </div>
    <div class="bento-grid" id="tech">
      {{TECH_ARTICLES}}
    </div>

    <div class="section-row">
      <div class="section-row__label">World, Economy, Science &amp; Culture</div>
    </div>
    <div class="bento-grid" id="other">
      {{OTHER_ARTICLES}}
    </div>
  </main>

  <footer class="footer">
    <span>My Knowledge</span>
    <span>{{WEEK_LABEL}}</span>
  </footer>

</body>
</html>
