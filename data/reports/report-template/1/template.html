<!DOCTYPE html>
<!-- Hallmark · macrostructure: Newsprint · genre: editorial · theme: Broadsheet · light -->
<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{WEEK_LABEL}} — My Knowledge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper: oklch(97% 0.015 80);
      --color-ink: oklch(12% 0.01 220);
      --color-ink-2: oklch(40% 0.01 220);
      --color-accent: oklch(42% 0.18 25);
      --color-border: oklch(82% 0.01 80);
      --font-display: "Playfair Display", Georgia, serif;
      --font-body: "Source Serif 4", Georgia, serif;
      --font-ui: system-ui, sans-serif;
      --space-sm: 0.75rem;
      --space-md: 1.5rem;
      --space-lg: 3rem;
      --space-xl: 5rem;
    }

    html { overflow-x: clip; }
    body {
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.65;
      min-height: 100dvh;
    }

    /* ── Masthead ── */
    .masthead {
      border-top: 4px solid var(--color-ink);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-sm) var(--space-lg);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .masthead__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .masthead__meta {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      color: var(--color-ink-2);
      text-align: right;
      line-height: 1.4;
    }
    .masthead__week {
      font-weight: 600;
      color: var(--color-ink);
    }

    /* ── Category nav ── */
    .cat-nav {
      border-bottom: 2px solid var(--color-ink);
      padding: 0.5rem var(--space-lg);
      display: flex;
      gap: var(--space-md);
      align-items: center;
      flex-wrap: wrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-nav__item {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-ink-2);
      text-decoration: none;
      white-space: nowrap;
    }
    .cat-nav__item:hover { color: var(--color-accent); }
    .cat-nav__sep {
      width: 1px;
      height: 0.9em;
      background: var(--color-border);
      flex-shrink: 0;
    }

    /* ── Main grid ── */
    .main {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 0;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── Left column (Tech) ── */
    .col-tech {
      padding: var(--space-md) var(--space-lg) var(--space-lg) var(--space-lg);
      border-right: 1px solid var(--color-border);
    }
    .col-header {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-ink-2);
      border-top: 2px solid var(--color-ink);
      padding-top: 0.4rem;
      margin-bottom: var(--space-md);
    }

    /* ── Right column (Other) ── */
    .col-other {
      padding: var(--space-md) var(--space-lg) var(--space-lg) var(--space-lg);
    }

    /* ── Article items ── */
    .article {
      padding-bottom: var(--space-md);
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .article:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .article__headline {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.25rem;
      line-height: 1.25;
      margin-bottom: 0.35rem;
    }
    .article__headline a {
      color: var(--color-ink);
      text-decoration: none;
    }
    .article__headline a:hover {
      color: var(--color-accent);
    }
    .article__meta {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      color: var(--color-ink-2);
      margin-bottom: 0.5rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .article__meta .sep { color: var(--color-border); }
    .article__body {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--color-ink);
    }

    /* Lead article (first in Tech) — larger treatment */
    .article--lead .article__headline {
      font-size: 1.65rem;
      font-weight: 700;
    }

    /* Sub-section headers within cols */
    .section-divider {
      font-family: var(--font-ui);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-ink-2);
      border-top: 1px solid var(--color-border);
      padding-top: 0.35rem;
      margin: var(--space-md) 0 var(--space-sm);
    }

    /* ── Footer ── */
    .footer {
      border-top: 4px double var(--color-border);
      padding: var(--space-sm) var(--space-lg);
      font-family: var(--font-ui);
      font-size: 0.7rem;
      color: var(--color-ink-2);
      text-align: center;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .masthead { padding: var(--space-sm) var(--space-md); }
      .cat-nav { padding: 0.5rem var(--space-md); }
      .main { grid-template-columns: 1fr; }
      .col-tech { border-right: none; border-bottom: 2px solid var(--color-border); padding: var(--space-md); }
      .col-other { padding: var(--space-md); }
      .footer { padding: var(--space-sm) var(--space-md); }
    }
    @media (max-width: 480px) {
      .masthead__title { font-size: 1.5rem; }
      .article__headline { font-size: 1.1rem; }
      .article--lead .article__headline { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header class="masthead">
    <div class="masthead__title">MY KNOWLEDGE</div>
    <div class="masthead__meta">
      <div class="masthead__week">{{WEEK_LABEL}}</div>
      <div>{{GENERATED_DATE}} 生成</div>
    </div>
  </header>

  <nav class="cat-nav" aria-label="カテゴリー">
    <a class="cat-nav__item" href="#tech">Technology</a>
    <span class="cat-nav__sep" aria-hidden="true"></span>
    <a class="cat-nav__item" href="#world">World Affairs</a>
    <span class="cat-nav__sep" aria-hidden="true"></span>
    <a class="cat-nav__item" href="#economy">Economy</a>
    <span class="cat-nav__sep" aria-hidden="true"></span>
    <a class="cat-nav__item" href="#science">Science</a>
    <span class="cat-nav__sep" aria-hidden="true"></span>
    <a class="cat-nav__item" href="#culture">Culture</a>
  </nav>

  <main class="main">
    <section class="col-tech" id="tech" aria-label="Technology">
      <div class="col-header">Technology &amp; Development</div>
      {{TECH_ARTICLES}}
    </section>

    <section class="col-other" id="other" aria-label="World, Economy, Science, Culture">
      {{OTHER_ARTICLES}}
    </section>
  </main>

  <footer class="footer">
    My Knowledge Weekly · {{WEEK_LABEL}} · 個人情報プラットフォーム
  </footer>

</body>
</html>
